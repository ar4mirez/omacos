name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: brew install shellcheck yq jq gum

      - name: Run the test suite
        run: ./test/run.sh

      - name: Every command has a summary
        run: |
          missing=0
          for f in bin/omacos-*; do
            grep -q '^# omacos:summary=' "$f" || { echo "missing summary: $f"; missing=1; }
          done
          exit $missing

      - name: Theme staging stays allow-list based
        # The filter must name what an untrusted theme MAY ship, never what it
        # may not: a deny-list silently admits every file type added later.
        run: |
          grep -qF 'case $1 in' bin/omacos-theme-set || { echo "staging filter changed shape"; exit 1; }
          grep -qF 'colors.toml | *.png' bin/omacos-theme-set || { echo "allow-list missing"; exit 1; }

      - name: Every theme applier in the fan-out exists
        run: |
          missing=0
          sed -n '/^post_theme_commands=(/,/^)/p' bin/omacos-theme-set \
            | grep -oE 'omacos-theme-set-[a-z]+' | sort -u | while read -r cmd; do
              test -x "bin/$cmd" || { echo "fan-out references missing $cmd"; exit 1; }
            done

      - name: Generated files carry a do-not-edit header
        run: |
          grep -q 'GENERATED BY omacos' bin/omacos-keymap-build || exit 1
          grep -rq 'Generated by omacos' default/themed/ || exit 1

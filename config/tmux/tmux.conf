# ~/.config/tmux/tmux.conf — yours. omacos seeded it once.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 100000
set -g focus-events on

# Vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# Colours from the active omacos theme. `-q` keeps tmux quiet if no theme is
# set yet; the file is regenerated on every `omacos theme set`.
source-file -q ~/.local/state/omacos/current/theme/tmux.conf
source-file -q ~/.config/tmux/local.conf

# omacos keymap — the source of truth for window-manager keybindings.
#
# Format:  key | description | action
#   key         AeroSpace syntax: alt-h, alt-shift-1, alt-cmd-enter, alt-slash
#   description what shows in `omacos keymap show` (and the on-screen cheatsheet)
#   action      an AeroSpace command, or `exec-and-forget <shell command>`
#
# Edit this file, then run `omacos keymap build` to regenerate aerospace.toml.
# Anything you delete here disappears from the keymap: this file wins.
#
# The modifier ladder:
#   alt          window management
#   alt-shift    move things (windows, workspaces) and launch apps
#   alt-ctrl     system panels and controls
#   alt-cmd      variants of the plain alt action
#
# `alt` stands in for Omarchy's Super. Cmd belongs to macOS apps, and nothing in
# macOS claims alt-1..9.

# ---------------------------------------------------------------- focus ---
alt-h | Focus left | focus left
alt-j | Focus down | focus down
alt-k | Focus up | focus up
alt-l | Focus right | focus right
alt-tab | Focus the previous workspace | workspace-back-and-forth

# ----------------------------------------------------------------- move ---
alt-shift-h | Move window left | move left
alt-shift-j | Move window down | move down
alt-shift-k | Move window up | move up
alt-shift-l | Move window right | move right

# ---------------------------------------------------------------- layout ---
alt-slash | Toggle tiles horizontal/vertical | layout tiles horizontal vertical
alt-comma | Toggle accordion | layout accordion horizontal vertical
alt-f | Fullscreen | fullscreen
alt-t | Toggle floating | layout floating tiling
alt-w | Close window | close
alt-shift-w | Close all windows but this one | close-all-windows-but-current
alt-r | Resize mode | mode resize
alt-shift-semicolon | Service mode | mode service

# ------------------------------------------------------------ workspaces ---
alt-1 | Workspace 1 | workspace 1
alt-2 | Workspace 2 | workspace 2
alt-3 | Workspace 3 | workspace 3
alt-4 | Workspace 4 | workspace 4
alt-5 | Workspace 5 | workspace 5
alt-6 | Workspace 6 | workspace 6
alt-shift-1 | Move window to workspace 1 | move-node-to-workspace 1
alt-shift-2 | Move window to workspace 2 | move-node-to-workspace 2
alt-shift-3 | Move window to workspace 3 | move-node-to-workspace 3
alt-shift-4 | Move window to workspace 4 | move-node-to-workspace 4
alt-shift-5 | Move window to workspace 5 | move-node-to-workspace 5
alt-shift-6 | Move window to workspace 6 | move-node-to-workspace 6

# ----------------------------------------------------------------- apps ---
alt-enter | Terminal | exec-and-forget open -na Ghostty
alt-cmd-enter | Terminal with tmux | exec-and-forget open -na Ghostty --args -e tmux new-session -A -s main
alt-shift-b | Browser | exec-and-forget open -a Safari
alt-shift-f | Finder | exec-and-forget open -a Finder

# --------------------------------------------------------------- omacos ---
alt-space | The omacos menu | exec-and-forget omacos-menu
alt-ctrl-k | Show all keybindings | exec-and-forget omacos-keymap-show --window
alt-ctrl-space | Next theme | exec-and-forget omacos-theme-next
alt-ctrl-t | Activity monitor | exec-and-forget omacos-launch-tui btop

# omacos keymap — the source of truth for window-manager keybindings.
#
# Format:  key | description | action
#   key         AeroSpace syntax: alt-h, alt-shift-1, alt-cmd-enter, alt-slash
#   description what shows in `omacos keymap show` (and the on-screen cheatsheet)
#   action      an AeroSpace command, or `exec-and-forget <shell command>`
#
# Edit this file, then run `omacos keymap build` to regenerate aerospace.toml.
# Anything you delete here disappears from the keymap: this file wins.
#
# The modifier ladder:
#   alt          window management
#   alt-shift    move things (windows, workspaces) and launch apps
#   alt-ctrl     system panels, capture and toggles
#   alt-ctrl-shift  the same thing, in its other direction (clear, pick, stop)
#   alt-cmd      variants of the plain alt action — including its reverse,
#                which is how alt-backtick cycles forward and alt-cmd-backtick
#                cycles back
#
# `alt` stands in for Omarchy's Super. Cmd belongs to macOS apps, and nothing in
# macOS claims alt-1..9.
#
# `omacos setup capslock option` makes Caps Lock a second alt, which puts every
# binding below under your left pinky — Omarchy's Super key, without a driver.

# ---------------------------------------------------------------- focus ---
alt-h | Focus left | focus left
alt-j | Focus down | focus down
alt-k | Focus up | focus up
alt-l | Focus right | focus right
alt-tab | Focus the previous window | focus-back-and-forth
alt-ctrl-tab | Focus the previous workspace | workspace-back-and-forth
alt-cmd-h | Focus the monitor to the left | focus-monitor left
alt-cmd-l | Focus the monitor to the right | focus-monitor right
# dfs, not a direction: nested containers take the opposite orientation (see
# base.toml), so which way is "next" is not something you can point at.
alt-backtick | Cycle focus through the windows here | focus --wrap-around dfs-next
alt-cmd-backtick | Cycle focus backwards | focus --wrap-around dfs-prev

# ----------------------------------------------------------------- move ---
alt-shift-h | Move window left | move left
alt-shift-j | Move window down | move down
alt-shift-k | Move window up | move up
alt-shift-l | Move window right | move right
alt-shift-cmd-h | Move this workspace to the left monitor | move-workspace-to-monitor left
alt-shift-cmd-l | Move this workspace to the right monitor | move-workspace-to-monitor right
alt-shift-backtick | Rotate this window through the layout | swap --wrap-around dfs-next
# --focus-follows-window, or the window lands on the other display and you stay.
alt-shift-leftSquareBracket | Move window to the previous monitor | move-node-to-monitor --wrap-around --focus-follows-window prev
alt-shift-rightSquareBracket | Move window to the next monitor | move-node-to-monitor --wrap-around --focus-follows-window next

# ---------------------------------------------------------------- layout ---
alt-slash | Toggle tiles horizontal/vertical | layout tiles horizontal vertical
# A stack is the closest AeroSpace gets to Omarchy's window groups: same
# "many windows, one slot", without a tab bar.
alt-comma | Toggle stacking | layout accordion tiles
alt-cmd-comma | Stack this window with the one to its right | ['join-with right', 'layout accordion']
alt-f | Fullscreen | fullscreen
alt-cmd-f | Native macOS fullscreen | macos-native-fullscreen
alt-equal | Grow the window | resize smart +50
alt-minus | Shrink the window | resize smart -50
alt-t | Toggle floating | layout floating tiling
alt-w | Close window | close
alt-shift-w | Close all windows but this one | close-all-windows-but-current
alt-cmd-equal | Balance window sizes | balance-sizes
alt-cmd-t | Suspend window management | enable toggle
alt-r | Resize mode | mode resize
alt-shift-semicolon | Service mode | mode service

# ------------------------------------------------------------ workspaces ---
alt-leftSquareBracket | Previous workspace | workspace --wrap-around prev
alt-rightSquareBracket | Next workspace | workspace --wrap-around next
alt-1 | Workspace 1 | workspace 1
alt-2 | Workspace 2 | workspace 2
alt-3 | Workspace 3 | workspace 3
alt-4 | Workspace 4 | workspace 4
alt-5 | Workspace 5 | workspace 5
alt-6 | Workspace 6 | workspace 6
alt-shift-1 | Move window to workspace 1 and follow | move-node-to-workspace --focus-follows-window 1
alt-shift-2 | Move window to workspace 2 and follow | move-node-to-workspace --focus-follows-window 2
alt-shift-3 | Move window to workspace 3 and follow | move-node-to-workspace --focus-follows-window 3
alt-shift-4 | Move window to workspace 4 and follow | move-node-to-workspace --focus-follows-window 4
alt-shift-5 | Move window to workspace 5 and follow | move-node-to-workspace --focus-follows-window 5
alt-shift-6 | Move window to workspace 6 and follow | move-node-to-workspace --focus-follows-window 6

# Multi-monitor only: pull a workspace onto the display you are looking at.
# On a single display these do nothing — delete the block if that is you.
alt-cmd-1 | Bring workspace 1 to this monitor | summon-workspace 1
alt-cmd-2 | Bring workspace 2 to this monitor | summon-workspace 2
alt-cmd-3 | Bring workspace 3 to this monitor | summon-workspace 3
alt-cmd-4 | Bring workspace 4 to this monitor | summon-workspace 4
alt-cmd-5 | Bring workspace 5 to this monitor | summon-workspace 5
alt-cmd-6 | Bring workspace 6 to this monitor | summon-workspace 6

# The scratchpad is Omarchy's overlay workspace, done with what AeroSpace has:
# a workspace named S that nothing else sends windows to.
alt-s | The scratchpad workspace | workspace S
# No --focus-follows-window here on purpose: sending something out of sight is
# the whole point of a scratchpad.
alt-shift-s | Move window to the scratchpad | move-node-to-workspace S

# ----------------------------------------------------------------- apps ---
alt-enter | Terminal | exec-and-forget open -na Ghostty
alt-cmd-enter | Terminal with tmux | exec-and-forget open -na Ghostty --args -e tmux new-session -A -s main
alt-shift-b | Browser | exec-and-forget omacos-launch-browser
alt-shift-f | Finder | exec-and-forget open -a Finder
alt-shift-n | Neovim | exec-and-forget omacos-launch-tui nvim

# --------------------------------------------------------------- omacos ---
# macOS already has a launcher on cmd-space, so alt-space is the omacos menu
# rather than Omarchy's second one.
alt-space | The omacos menu | exec-and-forget omacos-menu
alt-esc | Power menu | exec-and-forget omacos-menu power
alt-ctrl-k | Show all keybindings | exec-and-forget omacos-keymap-show --window
alt-ctrl-t | Activity monitor | exec-and-forget omacos-launch-tui btop

# ------------------------------------------------------- system controls ---
# Omarchy opens a TUI for each of these; macOS keeps them in System Settings,
# so that is where these go rather than pretending otherwise.
alt-ctrl-a | Sound settings | exec-and-forget open x-apple.systempreferences:com.apple.Sound-Settings.extension
alt-ctrl-w | Wi-Fi settings | exec-and-forget open x-apple.systempreferences:com.apple.wifi-settings-extension
alt-ctrl-b | Bluetooth settings | exec-and-forget open x-apple.systempreferences:com.apple.BluetoothSettings
# Dismissing and replaying notifications is Notification Center UI scripting,
# which breaks on most macOS releases. The settings pane is the honest door.
alt-ctrl-shift-comma | Notification settings | exec-and-forget open x-apple.systempreferences:com.apple.Notifications-Settings.extension

# ----------------------------------------------------------------- style ---
alt-ctrl-space | Next background in this theme | exec-and-forget omacos-theme-background
alt-ctrl-shift-space | Pick a theme | exec-and-forget omacos-menu-theme
alt-ctrl-shift-a | Toggle light/dark | exec-and-forget omacos-cmd-toggle-appearance

# --------------------------------------------------------------- capture ---
alt-ctrl-c | Capture menu | exec-and-forget omacos-menu capture
alt-shift-p | Screenshot a region | exec-and-forget omacos-capture-screenshot region
alt-ctrl-shift-p | Screenshot a window | exec-and-forget omacos-capture-screenshot window
alt-ctrl-p | Start or stop a screen recording | exec-and-forget omacos-capture-screenrecording region
alt-ctrl-o | Extract text from the screen | exec-and-forget omacos-capture-text
alt-ctrl-shift-c | Pick a colour from the screen | exec-and-forget omacos-capture-color
alt-ctrl-u | Copy the browser's URL | exec-and-forget omacos-capture-url

# ------------------------------------------------------------- clipboard ---
# macOS already copies and pastes the same way everywhere, which is what
# Omarchy's Super+C/V exists to fix on Linux. History is the part it lacks.
alt-ctrl-v | Clipboard history | exec-and-forget omacos-clipboard-history

# --------------------------------------------------------------- notices ---
alt-ctrl-shift-t | Show the time | exec-and-forget omacos-notice time
alt-ctrl-shift-b | Show the battery | exec-and-forget omacos-notice battery
alt-ctrl-shift-w | Show the weather | exec-and-forget omacos-notice weather

# ------------------------------------------------------------- reminders ---
alt-ctrl-r | Set a reminder | exec-and-forget omacos-reminder
alt-ctrl-shift-r | Clear all reminders | exec-and-forget omacos-reminder clear

# --------------------------------------------------------------- toggles ---
alt-ctrl-i | Keep the screen awake | exec-and-forget omacos-toggle-idle
alt-ctrl-n | Night Shift | exec-and-forget omacos-toggle-nightlight
alt-ctrl-g | Toggle window gaps | exec-and-forget omacos-toggle-gaps
alt-ctrl-shift-s | Next audio output | exec-and-forget omacos-toggle-audio-output
alt-shift-space | Toggle the top bar | exec-and-forget omacos-toggle-bar
alt-ctrl-comma | Do Not Disturb | exec-and-forget omacos-toggle-dnd
alt-ctrl-l | Lock the screen | exec-and-forget pmset displaysleepnow
alt-ctrl-shift-l | Start the screensaver | exec-and-forget omacos-cmd-screensaver

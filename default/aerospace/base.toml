# omacos AeroSpace base settings — package-owned. Keybindings are appended by
# `omacos keymap build` from ~/.config/omacos/keymap.conf.

# config-version 2 replaces v1's habit of inferring workspaces from keybindings,
# which the upstream guide calls error-prone. persistent-workspaces is appended
# by `omacos keymap build`, derived from the keymap.
config-version = 2

after-login-command = []
after-startup-command = [
  'exec-and-forget /opt/homebrew/bin/borders',
  'exec-and-forget /opt/homebrew/bin/sketchybar',
  # A pin is a window id, and window ids do not survive the windows that owned
  # them. Starting with an empty set beats inheriting pins for windows that
  # closed while AeroSpace was not running.
  'exec-and-forget omacos-window-pin clear',
]

# AeroSpace reimplements workspaces rather than using native Spaces, so nothing
# else can observe a workspace switch. This is the only bridge SketchyBar gets,
# and the only moment a pinned window can be brought along (`omacos window pin`,
# which is how a window follows you everywhere without sticky-window support).
exec-on-workspace-change = [
  '/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE; omacos-window-follow-pinned',
]

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Omarchy's `Super + Arrow` "switches focus and moves the cursor to the center
# of the new application". The lazy variants only move the pointer when it is
# not already inside the window, so clicking a window never yanks the cursor.
on-focus-changed = ['move-mouse window-lazy-center']
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = true

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

# Apps that must never be tiled: modal, utility, or genuinely fixed-size.
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = 'Info'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

# omacos TUI windows (the menu, the keybinding cheatsheet) are transient, so
# they float instead of rearranging your tiles every time you open one.
#
# The substring is a contract, not a coincidence: `omacos launch tui` puts it
# in the title, and `omacos tui install` decides float or tile by whether it
# asks for a title carrying it. A tiling TUI is simply one whose title does
# not, so it falls through to the default layout.
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
if.window-title-regex-substring = 'omacos'
run = 'layout floating'
